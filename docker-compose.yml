services:
  mysql8:
    container_name: mysql8
    image: mysql:8.0
    networks:
      - sist_net
    volumes:
      - ./db/conf.d:/etc/mysql/conf.d
      - ./db/data:/var/lib/mysql
      - ./db/initdb.d:/docker-entrypoint-initdb.d
    env_file:
      - .env
    ports:
      - "3307:3306"
    restart: always
  backend:
    build:
      #context: ./boot2
      context: .
      dockerfile: Dockerfile
    container_name: backend
    networks:
      - sist_net
    ports:
      - "8080:8080"
    depends_on:
      - mysql8
networks:
  sist_net:
    driver: bridge
