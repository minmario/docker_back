# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    #Gradle 캐시 설정(빌드 속도 향상)
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{runner.os}}-gradle-${{hashFiles('**/*.gradle','**/gradle-wrapper.properties')}}
        restore-keys: |
            ${{ runner.os }}-gradle
      

    - name: Build with Gradle Wrapper
      run: ./gradlew clean build
    - name: 사용자를 Docker그룹에 추가 
      run: | 
        sudo usermod -aG docker $USER
        
    - name: 도커 세션 로드하기 
      run: | 
          sudo chmod 666 /var/run/docker.sock 
    - name: 셀상의 EC2 접근과 도커 compose실행 
      run: | 
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.HOST }} << 'EOF' 
          # 여러 줄의 명려어를 SSH를 통해 원격으로 EC2서버에 전송할 수 있게 한다. EOF로 끝을 알려준다.   
            cd /home/ubuntu/docker_next 
            docker-compose down 
            docker-compose up -d --build 
          EOF
